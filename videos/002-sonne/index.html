<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/sim.js"></script>
    <script src="assets/timing.js"></script>
    <link rel="stylesheet" href="assets/sim.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #04050b; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Inter", sans-serif; }
      /* Weltall – bleibt über alle Szenen stehen */
      #space { position: absolute; inset: 0;
        background: radial-gradient(110% 55% at 50% 55%, #151230 0%, #0a0918 50%, #04050b 85%); }
      #stars { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="61.87" data-width="1080" data-height="1920">
      <div id="space"><svg id="stars" viewBox="0 0 1080 1920"></svg></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="4.609" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="licht" data-composition-id="licht" data-composition-src="compositions/licht.html" data-start="4.609" data-duration="15.507" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="drift" data-composition-id="drift" data-composition-src="compositions/drift.html" data-start="20.116" data-duration="14.782" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="kaelte" data-composition-id="kaelte" data-composition-src="compositions/kaelte.html" data-start="34.898" data-duration="9.106" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="tiefsee" data-composition-id="tiefsee" data-composition-src="compositions/tiefsee.html" data-start="44.004" data-duration="9.056" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="punch" data-composition-id="punch" data-composition-src="compositions/punch.html" data-start="53.06" data-duration="3.516" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="56.576" data-duration="5.294" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="61.87" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="60.269" data-track-index="3" data-volume="1.4"></audio>
    </div>
    <script>
      (function () {
        const svg = document.getElementById("stars"), r = SIM.rng(7);
        for (let i = 0; i < 320; i++) {
          SIM.el("circle", { cx: r() * 1080, cy: r() * 1920, r: r() < 0.9 ? 0.8 + r() * 1.3 : 2.3,
            fill: r() < 0.85 ? "#fff" : "#c9d4ff", opacity: 0.2 + r() * 0.65 }, svg);
        }
      })();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
