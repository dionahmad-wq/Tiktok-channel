<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/sim.js"></script>
    <script src="assets/timing.js"></script>
    <link rel="stylesheet" href="assets/sim.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06070e; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Inter", sans-serif; }
      /* Nachthimmel – bleibt über alle Szenen stehen */
      #sky { position: absolute; inset: 0;
        background: radial-gradient(120% 60% at 50% 58%, #1b1533 0%, #0c0b1c 45%, #06070e 80%); }
      #stars { position: absolute; inset: 0; }
      #moon { position: absolute; left: 880px; top: 210px; width: 46px; height: 46px; border-radius: 50%;
        background: #fffdf4; box-shadow: 0 0 40px 12px rgba(255, 250, 230, 0.28), 0 0 120px 40px rgba(160, 150, 255, 0.12); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62.85" data-width="1080" data-height="1920">
      <div id="sky"><svg id="stars" viewBox="0 0 1080 1920"></svg><div id="moon"></div></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="3.137" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ocean" data-composition-id="ocean" data-composition-src="compositions/ocean.html" data-start="3.137" data-duration="16.995" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="race" data-composition-id="race" data-composition-src="compositions/race.html" data-start="20.132" data-duration="15.941" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bolt" data-composition-id="bolt" data-composition-src="compositions/bolt.html" data-start="36.073" data-duration="6.776" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="escape" data-composition-id="escape" data-composition-src="compositions/escape.html" data-start="42.849" data-duration="12.16" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="punch" data-composition-id="punch" data-composition-src="compositions/punch.html" data-start="55.009" data-duration="2.672" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="57.681" data-duration="5.169" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="62.85" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="61.246" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      // Sterne: fest verteilt (Seed), damit jedes Bild identisch rendert
      (function () {
        const svg = document.getElementById("stars"), r = SIM.rng(42);
        for (let i = 0; i < 170; i++) {
          const y = r() * 1150;
          SIM.el("circle", { cx: r() * 1080, cy: y, r: r() < 0.88 ? 1 + r() * 1.2 : 2.2,
            fill: "#fff", opacity: (0.25 + r() * 0.6) * (1 - y / 1500) }, svg);
        }
      })();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
