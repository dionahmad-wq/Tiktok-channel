<!-- Szene 4 · Vergleich: Welle 40 vs. Usain Bolt 37,6 (Ø 100 m Weltrekord) vs. Du 15 km/h -->

    #bolt-note { font: 800 22px/1.3 "Inter", sans-serif; color: var(--mute); letter-spacing: 0.04em; }
  </style>
  <div id="root" data-composition-id="bolt" data-width="1080" data-height="1920">
    <svg id="bolt-world"></svg>
    <div id="bolt-head" class="ui-head ui"><div class="ui-pill"><em>Vergleich</em> · Top-Speed</div></div>

    <div id="bolt-card" class="ui-card ui">
      <div id="bolt-title">Wer ist schneller?</div>

        <svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="29" r="21" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6" />
          <circle id="bolt-ring" cx="27" cy="29" r="21" fill="none" stroke="#FFB547" stroke-width="6" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 27 29)" />

  <script>
    (function () {
      const L = VT.len("bolt");
      const world = new SIM.LandWorld(document.getElementById("bolt-world"), { ground: 1200, seed: 23 });
      world.draw({ cam: 200, sx: 0.9, anchor: 540, waveX: null, t: 0 });
      const sec = document.getElementById("bolt-sec"), ring = document.getElementById("bolt-ring");
      const w0 = VT.word("b3", 3), w1 = VT.seg("b3", "end") + 0.2;
      const S = { t: 0 };
      function draw() {
        const k = SIM.clamp((S.t - w0) / (w1 - w0), 0, 1);
        sec.textContent = SIM.fmtDec(9.58 * k, 2) + " s";
        ring.setAttribute("stroke-dashoffset", 132 * (1 - k));
      }
      const tl = gsap.timeline({ paused: true });
      tl.to(S, { t: L, duration: L, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#bolt-head", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#bolt-card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
      tl.fromTo("#bolt-bar-w", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo("#bolt-bar-a", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.fromTo("#bolt-bar-b", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.out" }, VT.word("b1", 1));
      tl.fromTo("#bolt-v", { scale: 1 }, { scale: 1.25, duration: 0.16, yoyo: true, repeat: 1 }, VT.word("b2", 5));
      tl.fromTo("#bolt-watch", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.25 }, w0 - 0.2);
      // Nach ~10 s ist Bolts Sprint vorbei → Balken fällt ab
      tl.to("#bolt-bar-b", { scaleX: 0.55, opacity: 0.45, duration: 0.6, ease: "power2.in" }, w1 - 0.1);
      draw();
      window.__timelines["bolt"] = tl;
    })();
  </script>
