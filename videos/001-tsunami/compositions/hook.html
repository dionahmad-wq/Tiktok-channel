<!-- Szene 1 · Hook: Frage + Duell-Aufstellung (Bild 0 = Thumbnail) -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #hook-world { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #hook-card { left: 100px; width: 880px; top: 330px; padding: 34px 30px 38px; text-align: center; }
    #hook-l1 { font: 900 62px/1.02 "Inter", sans-serif; letter-spacing: -0.01em; color: var(--ink); }
    #hook-l2 { font: 900 96px/1 "Inter", sans-serif; letter-spacing: -0.02em; color: var(--amber); margin-top: 10px;
      text-shadow: 0 0 30px rgba(255, 181, 71, 0.45); }
    #hook-sim { position: absolute; left: 0; right: 0; top: 700px; display: flex; justify-content: center; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <svg id="hook-world"></svg>
    <div id="hook-wave-tag" class="sim-tag ui" style="--c: var(--coral)"><b>B</b><span>TSUNAMI</span></div>
    <div id="hook-you" class="sim-actor ui"></div>

    <div id="hook-card" class="ui-card ui">
      <div id="hook-l1">KANNST DU EINEM<br />TSUNAMI</div>
      <div id="hook-l2">DAVONRENNEN?</div>
    </div>
    <div id="hook-sim" class="ui"><div id="hook-sim-pill" class="ui-pill">▶ <em>Simulation</em> startet</div></div>
  </div>
  <script>
    (function () {
      const L = VT.len("hook");
      const world = new SIM.LandWorld(document.getElementById("hook-world"), { ground: 1200, seed: 11 });
      const you = SIM.runner(document.getElementById("hook-you"));
      const tag = document.getElementById("hook-wave-tag");
      const S = { t: 0 };
      function draw() {
        const t = S.t;
        const waveX = -1000 + 14 * t; // rollt langsam heran
        world.draw({ cam: -500, sx: 0.64, anchor: 440, waveX, waveH: 170, t });
        const fx = world.toScreen(waveX);
        tag.style.transform = `translate(${fx - 70}px, ${world.G - 170 - 86}px)`;
        you.pose(t * 0.6, 0.15);
        you.place(world.toScreen(0), world.G, 1, 0);
      }
      const tl = gsap.timeline({ paused: true });
      tl.to(S, { t: L, duration: L, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#hook-l2", { scale: 1 }, { scale: 1.08, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, VT.word("h1", 4));
      tl.fromTo("#hook-sim-pill", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, VT.seg("h2"));
      draw();
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
