<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/sim.js"></script>
    <script src="assets/timing.js"></script>
    <script src="assets/vac.js"></script>
    <link rel="stylesheet" href="assets/sim.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #04050b; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Inter", sans-serif; }
      /* Weltall – bleibt über alle Szenen stehen */
      #space { position: absolute; inset: 0;
        background: radial-gradient(110% 55% at 50% 55%, #151230 0%, #0a0918 50%, #04050b 85%); }
      #stars { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="51.0" data-width="1080" data-height="1920">
      <div id="space"><svg id="stars" viewBox="0 0 1080 1920"></svg></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="6.46" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="punch" data-composition-id="punch" data-composition-src="compositions/punch.html" data-start="42.439" data-duration="3.327" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

    <script>
      (function () {
        const svg = document.getElementById("stars"), r = SIM.rng(7);
        for (let i = 0; i < 320; i++) {
          SIM.el("circle", { cx: r() * 1080, cy: r() * 1920, r: r() < 0.9 ? 0.8 + r() * 1.3 : 2.3,
            fill: r() < 0.85 ? "#fff" : "#c9d4ff", opacity: 0.2 + r() * 0.65 }, svg);
        }
      })();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
